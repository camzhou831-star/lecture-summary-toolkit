name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pillow
      - name: 单元测试(不需要 whisper/tesseract)
        run: python3 -W ignore::ResourceWarning -m unittest discover -s tests -v
      - name: 生成物一致性:AGENTS/CLAUDE/GEMINI.md 由 SKILL.md 生成,网页提示词由 policy.md 生成
        run: bash 工具/sync_agents.sh && git diff --exit-code AGENTS.md CLAUDE.md GEMINI.md prompts/
      - name: 仓库里不能混入课程内容(媒体/转写/OCR/课件/总结只允许 examples/ 下的合成示例)
        run: bash tests/check_no_course_content.sh
  pipeline-demo:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: 依赖
        run: brew install ffmpeg whisper-cpp tesseract poppler
      - name: Pillow
        run: python3 -m pip install --break-system-packages pillow
      - name: 缓存 whisper tiny.en 模型
        uses: actions/cache@v4
        with:
          path: ~/.local/share/whisper-models
          key: whisper-tiny-en-v1
      - name: 合成示例完整流水线(tiny.en 模型;整体 12 分钟超时,超时后打印转写日志)
        run: WHISPER_MODEL=tiny.en NO_GPU=1 perl -e 'alarm 720; exec @ARGV' bash tests/run_pipeline_demo.sh
