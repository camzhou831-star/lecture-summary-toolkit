name: Release
# 推送 v* 标签时:跑单元测试与一致性检查 → 打两个 zip → 建 GitHub Release
on:
  push: { tags: ["v*"] }
permissions: { contents: write }
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install pillow
      - name: 单元测试
        run: python3 -W ignore::ResourceWarning -m unittest discover -s tests
      - name: 生成物一致性与防泄漏
        run: bash 工具/sync_agents.sh && git diff --exit-code AGENTS.md CLAUDE.md GEMINI.md prompts/ && bash tests/check_no_course_content.sh
      - name: 打包
        run: python3 工具/build_release.py "${GITHUB_REF_NAME}"
      - name: 发布
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "${GITHUB_REF_NAME}" dist/*.zip --title "${GITHUB_REF_NAME}" --notes-file docs/release-notes.md
