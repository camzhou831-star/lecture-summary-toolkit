<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>总结工作台</title>
<link rel="stylesheet" href="/static/style.css?v=4">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>
<body>
<div class="app">
  <!-- 左栏:新建 + 历史 -->
  <aside class="sidebar">
    <div class="brand">
      <span class="logo"><svg viewBox="0 0 24 24"><path d="M4 5h16M4 10h10M4 15h16M4 20h8"/></svg></span>
      <span>总结工作台</span>
    </div>
    <button id="new-btn" class="btn btn-primary btn-block"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>新建总结</button>
    <div class="side-label">历史</div>
    <input id="search" class="input input-sm" placeholder="搜索标题…">
    <ul id="tasks" class="task-list"></ul>
    <div id="model" class="side-foot"></div>
  </aside>

  <!-- 主区 -->
  <main class="main">
    <!-- 新建页 -->
    <section id="home" class="home">
      <div class="home-inner">
        <h1>贴一个链接,出一份课程总结</h1>
        <p class="muted">支持 B 站、YouTube 链接,或本地视频 / 音频 / 字幕。带时间线,时间戳可点回原视频。</p>
        <form id="form" class="composer" autocomplete="off">
          <textarea id="source" rows="3" placeholder="粘贴链接(可以连分享文案一起贴),或本地文件路径"></textarea>
          <div class="composer-bar">
            <select id="lang" class="select" title="视频语言">
              <option value="auto">视频语言:自动</option>
              <option value="zh">视频语言:中文</option>
              <option value="en">视频语言:英文</option>
            </select>
            <select id="out_lang" class="select" title="总结语言">
              <option value="zh">总结:中文</option>
              <option value="en">总结:English</option>
            </select>
            <label class="btn btn-ghost" title="选本地文件"><svg viewBox="0 0 24 24"><path d="M21.4 11.1 12.2 20.3a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg>选文件<input type="file" id="file" accept="video/*,audio/*,.srt,.vtt" hidden></label>
            <span class="grow"></span>
            <button type="submit" class="btn btn-primary">开始总结<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
          </div>
        </form>
        <p id="formmsg" class="formmsg"></p>
        <div class="hints">
          <div class="hint"><b>模板</b><span>课程总结(七节结构 + 复习卡)</span></div>
          <div class="hint"><b>模型</b><span id="hint-model">—</span></div>
          <div class="hint"><b>暂不支持</b><span>抖音、学校 LMS:先下载再选文件</span></div>
        </div>
      </div>
      <div id="drop" class="drop"><div>松开即上传</div></div>
    </section>

    <!-- 详情页 -->
    <section id="detail" class="detail" hidden>
      <header class="detail-head">
        <div class="head-text">
          <div class="crumbs"><span id="d-kind" class="chip"></span><span id="d-time" class="muted"></span></div>
          <h2 id="d-title"></h2>
        </div>
        <div class="head-actions">
          <a id="d-open" class="btn btn-ghost btn-sm" target="_blank" rel="noopener" title="在原站打开"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg>原视频</a>
          <button id="d-copy" class="btn btn-ghost btn-sm" title="复制 Markdown"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg><span>复制</span></button>
          <button id="d-download" class="btn btn-ghost btn-sm" title="下载 .md"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>下载</button>
          <button id="d-retry" class="btn btn-ghost btn-sm" title="重跑"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg>重跑</button>
          <button id="d-del" class="btn btn-ghost btn-sm btn-danger" title="删除"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
        </div>
      </header>

      <div id="steps" class="steps"></div>
      <div id="d-status" class="status-line"></div>

      <div class="detail-body">
        <div class="reader">
          <div class="tabs" role="tablist">
            <button class="tab on" data-tab="summary">总结</button>
            <button class="tab" data-tab="transcript">文字稿</button>
            <button class="tab" data-tab="log">日志<span id="check-dot" class="dot"></span></button>
          </div>
          <article id="summary" class="pane md"></article>
          <div id="transcript" class="pane transcript" hidden></div>
          <div id="logpane" class="pane" hidden>
            <div id="d-check" class="callout"></div>
            <pre id="d-log" class="log"></pre>
          </div>
        </div>
        <aside class="side-panel">
          <div class="sticky">
            <div id="player" class="player"><div class="player-empty"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><span>点任意时间戳,在这里播放</span></div></div>
            <div class="panel-title">章节</div>
            <ol id="chapters" class="chapters"></ol>
          </div>
        </aside>
      </div>
    </section>
  </main>
</div>
<div id="toast" class="toast"></div>
<script src="/static/app.js?v=4"></script>
</body>
</html>
